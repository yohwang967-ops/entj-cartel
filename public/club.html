<!doctype html>
<html lang="ko"><meta charset="utf-8"><link rel="icon" href="/favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENTJ 카르텔</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 폰 한 화면 앱(최대 430px) · 위 모드 전환 · 가운데 내용 · 아래 탭 막대. 맥에서는 가운데 폰 크기로 */
:root{
  color-scheme: dark;
  --bg:#0f1216; --surface:#181c22; --surface2:#232931; --line:#2d343e;
  --ink:#f2f4f7; --sub:#b8c0cb; --muted:#7d8693;
  --all:#5b8def; --hobby:#35c9a0; --biz:#e9b04a;
  --accent:var(--all); --accent-ink:#0b0f14;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --name:"Gowun Batang","Noto Serif KR",serif;
  --body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app[data-mode=hobby]{--accent:var(--hobby)}
.app[data-mode=biz]{--accent:var(--biz)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

.app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

header{padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-size:24px;letter-spacing:.5px}
.logo b{color:var(--accent);font-weight:400;transition:color .25s}
.who{font-size:12px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:999px;padding:4px}
.modes button{padding:8px 4px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);transition:background .2s,color .2s}
.modes button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.view[hidden]{display:none}

/* 발견(프로필): 폰 = 이름 칸 위 · 이야기 아래 / 넓은 화면 = 왼쪽 이야기 · 오른쪽 이름 칸(폭 고정) */
.photo{position:relative;aspect-ratio:4/3;width:100%;border-radius:20px;overflow:hidden;touch-action:pan-y;user-select:none;transition:transform .3s ease, opacity .3s}
.photo .art{position:absolute;inset:0}
.noph{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--name);font-weight:700;font-size:96px;line-height:1;color:rgba(255,255,255,.9)}
.ph-b{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px}
.idt{display:flex;flex-direction:column;gap:6px;padding:14px 2px 4px}
.idt h2{margin:0;font-family:var(--name);font-weight:700;font-size:32px;line-height:1.15}
.idt h2 span{font-family:var(--body);font-weight:400;font-size:20px;color:var(--muted);margin-left:8px}
.idt .one{margin:0;font-family:var(--name);font-size:17px;font-weight:700;line-height:1.5;color:var(--ink)}
.mini{margin:6px 0 0;display:flex;flex-direction:column}
.mini div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mini dt{font-size:12.5px;color:var(--muted)}
.mini dd{margin:0;font-size:14px}
.rel b{font-weight:700}
.rel small{font-size:12px;color:var(--muted);margin-left:4px}
.aibox{margin-top:10px;padding:16px 16px 14px;border-radius:16px;background:var(--surface)}
.aibox .lab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.aibox .slogan{font-family:var(--display);font-size:24px;line-height:1.3;margin:10px 0 8px;color:var(--accent);word-break:keep-all;transition:color .25s}
.aibox .whois{margin:0;font-size:14px;line-height:1.65;color:var(--sub);word-break:keep-all}
.aibox .aift{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.aibox .aift b{color:var(--ink)}
.tale-h{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 4px}
.tale-h h3{margin:0;font-family:var(--name);font-size:22px}
.tale-h span{font-size:12.5px;color:var(--muted)}
.tale ol{list-style:none;margin:0;padding:0}
.tale li{position:relative;padding:16px 0 18px 26px;border-bottom:1px solid var(--line)}
.tale li:last-child{border-bottom:0}
.tale li::before{content:"";position:absolute;left:6px;top:24px;bottom:-24px;width:2px;background:var(--line)}
.tale li:last-child::before{display:none}
.tale li::after{content:"";position:absolute;left:2px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tale .no{font-size:12px;color:var(--muted);font-weight:700}
.tale h4{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.3px;color:var(--accent);word-break:keep-all;transition:color .25s}
.tale p{margin:0;font-family:var(--name);font-size:18px;line-height:1.75;word-break:keep-all}
.tale .tag{display:inline-block;margin-top:8px}
.tale-n{font-size:12px;color:var(--muted);margin:2px 2px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.badge.ok{background:var(--accent);color:var(--accent-ink)}
.counter{font-size:12px;color:var(--muted);margin:2px 2px 8px;display:flex;justify-content:space-between}

.prompt{border-top:1px solid var(--line);padding:14px 2px}
.prompt .q{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.prompt .a{font-family:var(--name);font-size:20px;font-weight:700;line-height:1.4}
.prompt .a.small{font-family:var(--body);font-size:15px;font-weight:500;line-height:1.6}
.prompt.hl .q{color:var(--accent)}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--sub);white-space:nowrap}
.tag.ai{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--surface2);color:var(--sub)}
.chip.match{background:var(--accent);color:var(--accent-ink);font-weight:700}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.facts li span:first-child{min-width:0}
.idt .hello{margin:6px 0 0;font-family:var(--name);font-size:15px;color:var(--sub)}
/* 보드: 위 숫자 요약 → 랭킹 · 트로피 → 모든 도전 · 성취 */
.bd-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 2px 14px}
.bd-h{margin:0;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.5px}
.bd-s{margin:4px 0 0;font-size:13.5px;color:var(--sub)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--surface2);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:12px 6px}
.kpi:nth-child(odd){border-right:1px solid var(--line)}
.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2;word-break:keep-all}
.kpi span{font-size:12px;color:var(--muted)}
.champ{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.champ .av{width:72px;height:72px;font-size:30px}
.champ .k1{font-size:12px;font-weight:700;color:var(--accent)}
.champ .nm{font-family:var(--name);font-size:22px;font-weight:700}
.champ .tt{font-size:13px;color:var(--sub)}
.champ .sl{font-family:var(--display);font-size:16px;color:var(--ink);margin-top:4px;word-break:keep-all}
.rrow{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:10px}
.rrow .rn{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.rrow .av{width:44px;height:44px;font-size:18px}
.rrow .nm{font-weight:700}
.rrow .tt{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .dims{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .sc{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.sbar{grid-column:3/-1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--accent)}
.trow{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.trow .th{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trow b{font-size:15px}
.trow .cnt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .cnt.zero{color:var(--muted);font-weight:500}
.trow .ds{font-size:12.5px;color:var(--muted)}
.trow .faces .av{width:24px;height:24px;font-size:11px}
.frow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:10px}
.frow .av{width:40px;height:40px;font-size:16px}
.frow .ft{font-size:14px}
.frow .ft b{margin-right:6px}
.frow .ftg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rrow:hover,.frow:hover,.champ:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.champ:hover{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.note{font-size:12px;color:var(--muted);margin:10px 2px 0;line-height:1.6}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.info div.wide{grid-column:1/-1}
.info dt{font-size:12px;color:var(--muted)}
.info dd{margin:0;font-weight:500}
.give{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.give h4{margin:0 0 6px;font-size:12px;color:var(--muted)}

.actions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;z-index:5}
.actions button{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.actions .yes{width:68px;height:68px;background:var(--accent);color:var(--accent-ink)}
.actions svg{width:26px;height:26px}
.actions .lbl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.actions button{position:relative}
.actions .yes[aria-pressed=true]{background:var(--surface2);color:var(--accent);outline:2px solid var(--accent)}

.empty{text-align:center;padding:60px 10px;color:var(--sub)}
.empty b{display:block;font-family:var(--name);font-size:22px;color:var(--ink);margin-bottom:6px}

/* 겹침 · 모임 · 내 프로필 · 수집 */
h3.sec{font-size:13px;color:var(--muted);font-weight:700;margin:18px 2px 8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--name);font-weight:700;font-size:22px;color:#fff}
.row .txt{min-width:0;flex:1}
.row .nm{font-weight:700}
.row .ds{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ice{font-size:13px;color:var(--accent);margin-top:2px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--sub);white-space:nowrap}
.newm{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.newm .av{width:64px;height:64px;outline:2px solid var(--accent);outline-offset:3px}
.newm div{text-align:center;font-size:12px;color:var(--sub);flex:none}

.group{background:var(--surface);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.group .gt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.group .gt b{font-size:16px}
.group p{margin:0;font-size:13.5px;color:var(--sub)}
.faces{display:flex}
.faces .av{width:28px;height:28px;font-size:12px;margin-right:-6px;outline:2px solid var(--surface)}
.join{align-self:flex-start;padding:7px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}
.join[aria-pressed=true]{background:var(--surface2);color:var(--sub)}

.notice{background:var(--surface);border-radius:18px;padding:14px 16px;font-size:13.5px;color:var(--sub)}
/* 말로 가입하기 */
.rc{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:8px}
.rc-pr{list-style:none;margin:14px 0 0;padding:0}
.rc-pr li{position:relative;padding:9px 0 9px 24px;border-top:1px solid var(--line);font-size:14px;color:var(--sub);word-break:keep-all}
.rc-pr li::before{content:"✓";position:absolute;left:2px;top:9px;color:var(--accent);font-weight:700}
.rc-ask{list-style:none;margin:0 0 16px;padding:0}
.rc-ask li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.rc-ask span{color:var(--muted);word-break:keep-all}
.rc .cta{width:100%}
.rc .cta.rc-on{background:#e5484d;color:#fff}
.rc .cta.rc-del{background:transparent;color:#ff8a8d;border:0;border-top:1px solid var(--line);border-radius:0;margin-top:14px}
.rc-ios{border-top:1px solid var(--line);padding:12px 2px;font-size:13.5px;color:var(--sub);word-break:keep-all}
.rc-ios b{color:var(--ink)}.rc-ios ol{margin:8px 0;padding-left:20px}.rc-ios p{margin:6px 0 0}
.rc-pend{display:grid;gap:8px;border-top:1px solid var(--line);padding:12px 2px;font-size:14px;word-break:keep-all}
.rc-pend span{color:var(--sub);font-size:13px}
.rc-file{display:block;text-align:center;margin-top:12px;font-size:13.5px;color:var(--sub);text-decoration:underline;cursor:pointer}
.rc-file input{display:none}
.rc-tip{font-size:13px;color:var(--muted);margin:10px 2px 0;word-break:keep-all}
.rc-busy,.rc-ok,.rc-err{font-size:14px;padding:12px 2px;border-top:1px solid var(--line);color:var(--sub);word-break:keep-all}
.rc-err{color:#ff8a8d}
.rc-ok b{color:var(--accent)}
.rc-txt{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink)}
.rc-txt li{padding:5px 0;word-break:keep-all}
.rc .join{margin-top:10px}
/* 보드 초대 QR */
.qr-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.qr-row img{width:88px;height:88px;border-radius:10px;background:#fff;display:block}
.qr-row b{display:block;font-size:15px}
.qr-row span{font-size:13px;color:var(--sub);word-break:keep-all}
.notice b{color:var(--ink)}
.field{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.field .k{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field .v{font-weight:500}
.field .ev{font-size:12.5px;color:var(--muted)}
.field .ctl{display:flex;gap:6px;flex-wrap:wrap}
.field .ctl button{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--surface2);color:var(--sub)}
.field .ctl button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.field.ai{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:12px;padding:12px 10px}
.cta{width:100%;margin-top:16px;padding:15px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:16px}
.cta:disabled{opacity:.4}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--sub);margin-top:10px}
.check input{margin-top:3px;accent-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.q-ask{font-size:13px;color:var(--accent);margin-top:4px}

nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;display:grid;grid-template-columns:repeat(6,1fr);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;position:relative}
nav button svg{width:22px;height:22px}
nav button[aria-current=true]{color:var(--ink)}
nav button[aria-current=true] svg{color:var(--accent)}
nav .n{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px}
.sample{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
/* 갤럭시 폴드를 펼친 화면 · 태블릿 · 맥(가로 760 이상): 위 한 줄 머리 · 왼쪽 사진 카드 · 오른쪽 질문 카드 두 단 */
@media (min-width:760px){
  .app,nav{max-width:none}
  header{flex-direction:row;align-items:center;justify-content:space-between;gap:20px;padding:10px 28px 8px}
  .modes{width:min(460px,50vw)}
  .who{display:block}
  main{padding:6px 28px 84px}
  nav{display:flex;justify-content:center;gap:8px}
  nav button{width:110px}
  /* 프로필: 왼쪽 이야기(남는 폭) · 오른쪽 이름 칸(300~360 고정 · 줄어들어 글자가 세로로 깨지지 않게) */
  #v-discover{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:36px;align-items:start;max-width:1180px;margin:0 auto}

// 찰떡 점수(0~100) = 대화 거리(겹치는 취미 · 관심사 하나당 15, 최대 45) + 서로 채워 줌(한 사람의 가장 강한 칸이 상대의 가장 약한 칸이면 15, 양쪽 최대 30) + 일로 이어짐(상대가 찾는 걸 줄 수 있으면 하나당 15 · 사업 제안에 열린 사람이 있고 상대가 줄 게 있으면 10, 최대 25)
function overlap(a,b){return [...new Set([...a.hobbies.filter(h=>b.hobbies.includes(h)),...a.likes.filter(h=>b.likes.includes(h))])]}
function pairInfo(a,b){
  const ov=overlap(a,b), why=[];
  const talk=Math.min(45,ov.length*15); if(ov.length)why.push("겹침: "+ov.join(" · "));
  const da=dimsOf(a.id), db=dimsOf(b.id), hi=d=>d.indexOf(Math.max(...d)), lo=d=>d.indexOf(Math.min(...d));
  let fill=0;
  if(da[hi(da)]>db[hi(da)]&&hi(da)===lo(db)){fill+=15;why.push(`${fn(a)}님의 ${DIMS[hi(da)]}이 ${fn(b)}님을 채움`)}
  if(db[hi(db)]>da[hi(db)]&&hi(db)===lo(da)){fill+=15;why.push(`${fn(b)}님의 ${DIMS[hi(db)]}이 ${fn(a)}님을 채움`)}
  let work=0;
  const g1=a.give.filter(x=>(b.seek||[]).includes(x)), g2=b.give.filter(x=>(a.seek||[]).includes(x));
  work+=(g1.length+g2.length)*15; g1.forEach(x=>why.push(`${fn(a)}님이 ${x}을 줄 수 있음`)); g2.forEach(x=>why.push(`${fn(b)}님이 ${x}을 줄 수 있음`));
  const bw=p=>p.give.filter(x=>!/영어|프리토킹|언어/.test(x));
  if(a.biz&&bw(b).length){work+=10;why.push(`${fn(a)}님이 사업 제안에 열려 있고 ${fn(b)}님은 ${bw(b)[0]}`)} else if(b.biz&&bw(a).length){work+=10;why.push(`${fn(b)}님이 사업 제안에 열려 있고 ${fn(a)}님은 ${bw(a)[0]}`)}
  work=Math.min(25,work);
  const pt=talk+fill+work;
  if(!why.length)why.push("겹치는 게 아직 없어요 · 모임 기록에서 공통점을 더 찾지 못했어요");
  return {pt,why,twin:pt,fit:pt,tw:why,ft:why};
}
function allPairs(){const r=[];P.forEach((a,i)=>P.slice(i+1).forEach(b=>r.push({a,b,...pairInfo(a,b)})));return r}
function bestFor(id){
  const me=byId(id), o=P.filter(p=>p.id!==id).map(p=>({p,...pairInfo(me,p)})).sort((x,y)=>y.pt-x.pt);
  const twin=o[0], fit=o[1]||o[0];
  return {twin,fit,rest:o.slice(2)};
}
const COMP=[["개발","신사업 개발"],["개발","매장 운영"],["마케팅","신사업 개발"],["창업 · 엑시트 경험","매장 운영"],["모임 운영","매장 운영"]];
function apkOverlap(a,b){return [...new Set([...a.hobbies.filter(h=>b.hobbies.includes(h)),...a.likes.filter(h=>b.likes.includes(h))])]}
function apkPair(a,b){
  const sh=a.hobbies.filter(h=>b.hobbies.includes(h)), sl=a.likes.filter(h=>b.likes.includes(h));
  const da=AI[a.id].sc, db=AI[b.id].sc;
  const sim=1-da.reduce((s,v,i)=>s+Math.abs(v-db[i]),0)/100, ag=Math.abs(a.age-b.age);
  const twin=Math.max(10,Math.min(98,Math.round(30+sh.length*14+sl.length*12+sim*24-ag*2)));
  const comp=COMP.filter(([x,y])=>(a.give.includes(x)&&b.give.includes(y))||(a.give.includes(y)&&b.give.includes(x)));
  const wa=da.indexOf(Math.min(...da)), wb=db.indexOf(Math.min(...db));
  const ca=db[wa]-da[wa]>=3, cb=da[wb]-db[wb]>=3;
  const fit=Math.max(10,Math.min(98,Math.round(35+comp.length*20+(ca||cb?10:0)+(sl.length?8:0)+(a.biz||b.biz?6:0)+sh.length*4)));
  const tw=[]; if(sh.length)tw.push("취미가 겹침: "+sh.join(" · ")); if(sl.length)tw.push("관심사가 겹침: "+sl.join(" · ")); if(sim>.85)tw.push("ENTJ 지수 네 칸 모양이 비슷함"); if(ag<=2)tw.push("또래");
  const ft=comp.map(([x,y])=>a.give.includes(x)&&b.give.includes(y)?`${fn(a)}님의 ${x} + ${fn(b)}님의 ${y}`:`${fn(a)}님의 ${y} + ${fn(b)}님의 ${x}`);
  if(ca)ft.push(`${fn(a)}님이 약한 '${DIMS[wa]}'을 ${fn(b)}님이 채움`); else if(cb)ft.push(`${fn(b)}님이 약한 '${DIMS[wb]}'을 ${fn(a)}님이 채움`);
  if(a.biz||b.biz)ft.push("사업 제안에 열려 있는 사람이 있음");
  return {twin,fit,tw:tw.length?tw:["둘 다 ENTJ"],ft:ft.length?ft:["하는 일이 달라 서로 배울 게 많음"]};
}

  extra.innerHTML='<div class="q">프로필 상세</div>'+p.facts.map(([v,k])=>'<p>'+esc(v)+' · '+esc(srcTag(k,p))+'</p>').join("")+'<p>성별 · '+esc(p.g)+'</p>';
  el.querySelector(".prof-l").append(extra);
  const legacy=document.createElement("details");legacy.className="prompt";
  legacy.innerHTML='<summary>APK 버전의 AI 점수와 짝 추천</summary><p>'+DIMS.map((d,i)=>d+' '+ai.sc[i]).join(' · ')+'</p>'+P.filter(o=>o.id!==p.id).map(o=>{const a=apkPair(p,o);return '<p><b>'+esc(o.name)+'</b> · 닮은 정도 '+a.twin+'점 · 잘 맞는 정도 '+a.fit+'점<br>'+esc([...a.tw,...a.ft].join(' · '))+'</p>'}).join('');
  el.querySelector(".prof-l").append(legacy);
}

// ───────── 보드 (첫 화면) ─────────
function openPerson(id){
  const k=deck().findIndex(x=>x.id===id); if(k<0) return;
  S.idx[S.mode]=k; S.tab="discover";
  try{localStorage.setItem("cartel-tab2",S.tab)}catch(e){}
  $("#main").scrollTop=0; render();
}
function pairRow(x){
  const pc=x.pt, why=x.why;
  return `<button class="pair" data-p="${x.a.id}"><div class="fc">${av(x.a)}${av(x.b)}</div><div class="pt"><b>${esc(x.a.name)} · ${esc(x.b.name)}</b><small>${esc(why.join(" · "))}</small></div><span class="pc">${pc}점</span></button>`;
}
function renderBoard(){
  const people=P;
  const cats={all:["biz","hobby","life"],hobby:["hobby","life"],biz:["biz","life"]}[S.mode];
  const tkeys=Object.keys(TROPHY).filter(k=>cats.includes(TROPHY[k].cat));
  const ach=ACH.filter(a=>tkeys.includes(a[2]));
  const won=tkeys.filter(k=>ach.some(a=>a[2]===k));
  const rk=ranking(people), top=rk[0], max=100;
  const modeName={all:"",hobby:" · 취미 · 여행",biz:" · 사업"}[S.mode];
  const trows=tkeys.map(k=>{const who=[...new Set(ach.filter(a=>a[2]===k).map(a=>a[0]))];return {k,who}}).sort((a,b)=>b.who.length-a.who.length);
  const ps=allPairs();
  const best3=[...ps].sort((a,b)=>b.pt-a.pt).slice(0,3);

  const pairHtml=`<section>
    <div class="tale-h"><h3>오늘 이 방의 찰떡 짝</h3><span class="tag ai">AI 추정 · 재미로</span></div>
    ${best3.map(x=>pairRow(x)).join("")}
    <p class="note">찰떡 점수 100점 = 대화 거리(겹치는 취미 · 관심사, 45) + 서로 채워 줌(한 사람의 가장 강한 ENTJ 칸이 상대의 가장 약한 칸, 30) + 일로 이어짐(상대가 찾는 걸 줄 수 있음 · 사업 제안, 25).</p>
    <p class="note">연결 탭에서 멤버별 추천 근거를 볼 수 있어요.</p>
  </section>`;

  const rankHtml=`<section>
    <div class="tale-h"><h3>누가 제일 ENTJ스러운가</h3><span class="tag ai">AI 추정 · 재미로</span></div>
    <button class="champ" data-p="${top.id}">${av(top)}<div><div class="k1">${rk.filter(p=>score(p.id)===score(top.id)).length>1?"공동 1위":"1위"} · ENTJ 지수 ${score(top.id)} · 근거 ${evN(top.id)}개</div><div class="nm">${esc(top.name)}</div><div class="tt">${esc(AI[top.id].title)}</div><div class="sl">"${esc(AI[top.id].slogan)}"</div></div></button>
    ${rk.map((p,j)=>`<button class="rrow" data-p="${p.id}"><span class="rn">${rankNo(rk,p.id)}</span>${av(p)}<div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="tt">${esc(AI[p.id].title)}</div><div class="dims">${DIMS.map((n,x)=>n+" "+dimsOf(p.id)[x]).join(" · ")} · 근거 ${evN(p.id)}개</div></div><span class="sc">${score(p.id)}</span><div class="sbar"><i style="width:${score(p.id)/max*100}%"></i></div></button>`).join("")}
    <p class="note">ENTJ 지수 = 추진력 · 결단력 · 리더십 · 끝장 근성 각 25점. 칸마다 기본 5점에, 녹음에서 나온 도전 · 성취 하나당 6점(AI 추정이면 3점)을 더해요. 예: 창업 = 추진력 · 결단력 · 리더십, 엑시트 = 결단력, 모임을 만듦 = 리더십 · 추진력, 하프마라톤 · 3대 500 · 학위 두 개 = 끝장 근성. 말한 만큼 올라가요.</p>
  </section>`;

  const trophyHtml=`<section>
    <div class="tale-h"><h3>트로피 · 도전과제</h3><span>${won.length} / ${tkeys.length}종 달성</span></div>
    ${trows.map(r=>{const t=TROPHY[r.k];return `<div class="trow"><div class="th"><b>${esc(t.t)}</b><span class="cnt ${r.who.length?"":"zero"}">${r.who.length?r.who.length+"명 달성":"아직 없음 · 첫 주인 모집"}</span></div><div class="ds">${esc(t.d)}</div>${r.who.length?`<div class="faces">${r.who.map(id=>av(byId(id))).join("")}</div>`:""}<div class="sbar" style="grid-column:auto"><i style="width:${r.who.length/people.length*100}%"></i></div></div>`}).join("")}
  </section>`;

  const feedHtml=`<section>
    <div class="tale-h"><h3>모든 도전 · 성취</h3><span>${ach.length}개</span></div>
    ${ach.map(a=>{const p=byId(a[0]);return `<button class="frow" data-p="${p.id}">${av(p)}<div style="min-width:0"><div class="ft"><b>${esc(p.name)}</b>${esc(a[1])}</div><div class="ftg"><span class="tag">${esc(TROPHY[a[2]].t)}</span>${a[3]?`<span class="tag ai">AI 추정 · 확인 전</span>`:""}</div></div></button>`}).join("")}
  </section>`;

  $("#v-board").innerHTML=`<div class="bd-top"><div><h2 class="bd-h">ENTJ 카르텔 보드${modeName}</h2><p class="bd-s">오늘 이 방에 모인 ENTJ가 도전하고 이룬 것, 한곳에.</p></div></div>
    <div class="kpis">
      <div class="kpi"><b>${people.length}명</b><span>이 방의 ENTJ</span></div>
      <div class="kpi"><b>${ach.length}개</b><span>도전 · 성취</span></div>
      <div class="kpi"><b>${won.length} / ${tkeys.length}종</b><span>트로피 달성</span></div>
      <div class="kpi"><b>${esc(top.name)}</b><span>ENTJ 지수 1위</span></div>
    </div>
    <a class="qr-row" href="/members?edit"><div><b>내 프로필 만들기 · 말로 작성</b><span>직접 입력하거나 녹음에서 초안을 만들어 보세요.</span></div></a>
    <a class="qr-row" href="/members"><div><b>새로 등록한 멤버 보기</b><span>웹에서 직접 작성한 공개 프로필</span></div></a>
    <details class="invite"><summary>모임 초대 QR</summary><img src="/entj-cartel-qr.png" width="208" height="208" alt="ENTJ 카르텔 공개 웹앱 초대 QR 코드"><a href="/entj-cartel-qr.png" download="ENTJ-카르텔-초대-QR.png">QR 이미지 저장</a></details>
    <div class="bd-grid">${rankHtml}<div>${pairHtml}${trophyHtml}</div></div>
    ${feedHtml}
    <div class="sample">실제 참가자 ${people.length}명 · 2026-11-21 녹음에서 Claude가 정리(본인 확인 전) · AI 점수와 짝 추천은 재미로</div>`;
  document.querySelectorAll("#v-board [data-p]").forEach(b=>b.onclick=()=>openPerson(+b.dataset.p));
}
function move(step){
  const d=deck(); const n=S.idx[S.mode]+step;
  if(n<0) return;
  const card=$("#card");
  if(card){card.style.transform=`translateX(${step>0?-60:60}px)`;card.style.opacity="0"}
  setTimeout(()=>{S.idx[S.mode]=Math.min(n,d.length); $("#main").scrollTop=0; render()},180);
}
function swipe(card){
  let x0=null,dx=0;
  card.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;card.style.transition="none";card.setPointerCapture(e.pointerId)});
  card.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx*.5}px)`});
  const end=()=>{if(x0===null)return;x0=null;card.style.transition="";if(Math.abs(dx)>90)move(dx<0?1:-1);else card.style.transform=""};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
}
